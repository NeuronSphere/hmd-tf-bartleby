# `version:` is obsolete in Compose v2 and only produces a warning.
services:
  transform_test:
    # TRANSFORM_IMAGE lets the suite run against a locally built image:
    #   TRANSFORM_IMAGE=hmd-tf-bartleby:local robot transform_run.robot
    # Without it the published image is used, as before. The default org is
    # neuronsphere; the old hmdlabs path is where this image used to live.
    image: ${TRANSFORM_IMAGE:-ghcr.io/neuronsphere/hmd-tf-bartleby:${VERSION}}
    container_name: transform-test
    environment:
      HMD_INSTANCE_NAME: transform-int-test
      HMD_REPO_NAME: transform-repo
      HMD_REPO_VERSION: test
      HMD_ENVIRONMENT: kmw
      HMD_REGION: reg1
      HMD_CUSTOMER_CODE: hmd
      HMD_DID: aaa
      HMD_DOC_REPO_NAME: bartleby-test
      HMD_DOC_REPO_VERSION: ${VERSION}
      TRANSFORM_INSTANCE_CONTEXT: $TRANSFORM_INSTANCE_CONTEXT
      TRANSFORM_NID: $TRANSFORM_NID
      CONFIDENTIALITY_STATEMENT: ${CONFIDENTIALITY_STATEMENT}
      NO_TIMESTAMP_TITLE: "true"
      DEFAULT_LOGO: ${DEFAULT_LOGO}
    volumes:
      - type: bind
        source: "${HMD_REPO_PATH}/${TRANSFORM_INPUT}"
        target: /hmd_transform/input
      - type: bind
        source: "${HMD_REPO_PATH}/${TRANSFORM_OUTPUT}"
        target: /hmd_transform/output
    secrets:
      - my_secret
secrets:
  my_secret:
    file: ./my_secret.txt
